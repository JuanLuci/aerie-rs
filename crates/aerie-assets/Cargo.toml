[package]
name = "aerie-assets"
description = "Reads the player's Hytale assets and builds the registries the client needs (spec 07)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aerie-protocol = { path = "../aerie-protocol" }
json5 = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
