name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Nothing that must stay out of the repository
        if: github.event_name == 'pull_request'
        run: tools/ci/guard.sh origin/${{ github.base_ref }}
      - name: Formatting
        run: cargo fmt --check
      - name: Python tools compile
        run: python3 -m py_compile tools/diff/*.py
      # No build or tests here: building needs the tables generated from a
      # copy of the game (gen/), which this repository must not hold. Build
      # and test locally (cargo test) before every push.
